version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: grid07-postgres
    environment:
      POSTGRES_DB: assignmentdb
      POSTGRES_USER: assignuser
      POSTGRES_PASSWORD: assign123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: grid07-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: